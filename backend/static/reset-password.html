<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password - GameHub</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="auth-page">

<div>
    <div class="auth-logo">🎮 GameHub</div>

    <div class="panel">
        <h1>Reset password</h1>
        <p class="subtitle">Choose a new password for your account</p>

        <form method="post" action="/reset-password">
            <input type="hidden" id="token" name="token">

            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password" minlength="8" maxlength="72" required autofocus>

            <label for="confirm_new_password">Confirm New Password</label>
            <input type="password" id="confirm_new_password" name="confirm_new_password" minlength="8" maxlength="72" required>

            <button type="submit" class="btn-primary">Reset Password</button>
        </form>

        <div id="message" class="message"></div>

        <div class="footer-link">
            <a href="/login">Back to login</a>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(location.search);
    const messageDiv = document.getElementById("message");
    const errors = {
        mismatch: "Passwords do not match.",
        weak: "Password must be 8-72 characters.",
        reused: "You've already used that password before. Choose a different one."
    };

    const token = params.get("token") || "";
    document.getElementById("token").value = token;

    const error = params.get("error");
    if (error && errors[error]) {
        messageDiv.innerText = errors[error];
        messageDiv.classList.add("error");
    }

    if (!token) {
        messageDiv.innerText = "Missing or invalid reset link.";
        messageDiv.classList.add("error");
    }
</script>

</body>
</html>
