<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password - Tic Tac Toe</title>

    <style>
        :root {
            --bg: #f4f4f4;
            --panel-bg: #ffffff;
            --text: #111111;
            --border: #222222;
            --accent: #16a34a;
            --error: #dc2626;
            --input-bg: #ffffff;
            --input-border: #999999;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212;
                --panel-bg: #1e1e1e;
                --text: #f0f0f0;
                --border: #444444;
                --accent: #4ade80;
                --error: #f87171;
                --input-bg: #2a2a2a;
                --input-border: #666666;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
        }

        .panel {
            width: 100%;
            max-width: 340px;
            background: var(--panel-bg);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 30px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-top: 0;
        }

        label {
            display: block;
            margin: 15px 0 5px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            background: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--input-border);
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: var(--accent);
            color: #ffffff;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .message.error {
            color: var(--error);
        }

        .footer-link {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        a {
            color: var(--accent);
        }
    </style>
</head>

<body>

<div class="panel">
    <h1>Reset Password</h1>

    <form method="post" action="/reset-password">
        <input type="hidden" id="token" name="token">

        <label for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password" minlength="8" maxlength="72" required autofocus>

        <label for="confirm_new_password">Confirm New Password</label>
        <input type="password" id="confirm_new_password" name="confirm_new_password" minlength="8" maxlength="72" required>

        <button type="submit">Reset Password</button>
    </form>

    <div id="message" class="message"></div>

    <div class="footer-link">
        <a href="/login">Back to login</a>
    </div>
</div>

<script>
    const params = new URLSearchParams(location.search);
    const messageDiv = document.getElementById("message");
    const errors = {
        mismatch: "Passwords do not match.",
        weak: "Password must be 8-72 characters.",
        reused: "You've already used that password before. Choose a different one."
    };

    const token = params.get("token") || "";
    document.getElementById("token").value = token;

    const error = params.get("error");
    if (error && errors[error]) {
        messageDiv.innerText = errors[error];
        messageDiv.classList.add("error");
    }

    if (!token) {
        messageDiv.innerText = "Missing or invalid reset link.";
        messageDiv.classList.add("error");
    }
</script>

</body>
</html>
