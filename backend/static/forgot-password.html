<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password - Tic Tac Toe</title>

    <style>
        :root {
            --bg: #f4f4f4;
            --panel-bg: #ffffff;
            --text: #111111;
            --border: #222222;
            --accent: #16a34a;
            --error: #dc2626;
            --input-bg: #ffffff;
            --input-border: #999999;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212;
                --panel-bg: #1e1e1e;
                --text: #f0f0f0;
                --border: #444444;
                --accent: #4ade80;
                --error: #f87171;
                --input-bg: #2a2a2a;
                --input-border: #666666;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
        }

        .panel {
            width: 100%;
            max-width: 340px;
            background: var(--panel-bg);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 30px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-top: 0;
        }

        p.hint {
            font-size: 14px;
            text-align: center;
            margin-top: 0;
        }

        label {
            display: block;
            margin: 15px 0 5px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            background: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--input-border);
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: var(--accent);
            color: #ffffff;
        }

        .footer-link {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        a {
            color: var(--accent);
        }
    </style>
</head>

<body>

<div class="panel">
    <h1>Forgot Password</h1>
    <p class="hint">Enter your email and we'll send you a link to reset your password.</p>

    <form method="post" action="/forgot-password">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus>

        <button type="submit">Send Reset Link</button>
    </form>

    <div class="footer-link">
        <a href="/login">Back to login</a>
    </div>
</div>

</body>
</html>
