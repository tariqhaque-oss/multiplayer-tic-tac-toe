<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Tic Tac Toe</title>

    <style>
        :root {
            --bg: #f4f4f4;
            --panel-bg: #ffffff;
            --text: #111111;
            --border: #222222;
            --accent: #16a34a;
            --error: #dc2626;
            --input-bg: #ffffff;
            --input-border: #999999;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212;
                --panel-bg: #1e1e1e;
                --text: #f0f0f0;
                --border: #444444;
                --accent: #4ade80;
                --error: #f87171;
                --input-bg: #2a2a2a;
                --input-border: #666666;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
        }

        .panel {
            width: 100%;
            max-width: 340px;
            background: var(--panel-bg);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 30px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-top: 0;
        }

        label {
            display: block;
            margin: 15px 0 5px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            background: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--input-border);
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: var(--accent);
            color: #ffffff;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .message.error {
            color: var(--error);
        }

        .footer-link {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        .forgot-link {
            display: block;
            text-align: right;
            font-size: 13px;
            margin-top: 6px;
        }

        a {
            color: var(--accent);
        }

        #resendForm {
            display: none;
            margin-top: 15px;
        }

        #resendForm button {
            margin-top: 8px;
        }
    </style>
</head>

<body>

<div class="panel">
    <h1>Login</h1>

    <form method="post" action="/login">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <a class="forgot-link" href="/forgot-password">Forgot password?</a>

        <button type="submit">Log In</button>
    </form>

    <div id="message" class="message"></div>

    <form id="resendForm" method="post" action="/resend-verification">
        <input type="hidden" id="resendEmail" name="email">
        <button type="submit">Resend verification email</button>
    </form>

    <div class="footer-link">
        Don't have an account? <a href="/signup">Sign up</a>
    </div>
</div>

<script>
    const params = new URLSearchParams(location.search);
    const messageDiv = document.getElementById("message");
    const resendForm = document.getElementById("resendForm");
    const emailInput = document.getElementById("email");

    const error = params.get("error");

    if (error === "invalid") {
        messageDiv.innerText = "Invalid email or password.";
        messageDiv.classList.add("error");
    } else if (error === "unverified") {
        messageDiv.innerText = "Please verify your email before logging in.";
        messageDiv.classList.add("error");
        resendForm.style.display = "block";
    } else if (error === "invalid_token") {
        messageDiv.innerText = "That verification link is invalid or has expired.";
        messageDiv.classList.add("error");
    } else if (error === "invalid_reset_link") {
        messageDiv.innerText = "That password reset link is invalid or has expired.";
        messageDiv.classList.add("error");
    } else if (params.get("created") === "1") {
        messageDiv.innerText = "Account created. Check your email for a verification link.";
    } else if (params.get("verified") === "1") {
        messageDiv.innerText = "Email verified. You can log in now.";
    } else if (params.get("resent") === "1") {
        messageDiv.innerText = "If that account needs verifying, a new email was sent.";
    } else if (params.get("reset_requested") === "1") {
        messageDiv.innerText = "If that email is registered, a reset link was sent.";
    } else if (params.get("reset_done") === "1") {
        messageDiv.innerText = "Password updated. You can log in now.";
    } else if (params.get("logged_out") === "1") {
        messageDiv.innerText = "You have been logged out.";
    }

    resendForm.addEventListener("submit", () => {
        document.getElementById("resendEmail").value = emailInput.value;
    });
</script>

</body>
</html>
