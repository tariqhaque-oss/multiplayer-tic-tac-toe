<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In - GameHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/login.css">
</head>

<body class="auth-page">

<div>
    <div class="auth-logo">🎮 GameHub</div>

    <div class="panel">
        <h1>Welcome back</h1>
        <p class="subtitle">Log in to keep playing</p>

        <form method="post" action="/login">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <a class="forgot-link" href="/forgot-password">Forgot password?</a>

            <button type="submit" class="btn-primary">Log In</button>
        </form>

        <div id="message" class="message"></div>

        <form id="resendForm" method="post" action="/resend-verification">
            <input type="hidden" id="resendEmail" name="email">
            <button type="submit" class="btn-secondary">Resend verification email</button>
        </form>

        <div class="footer-link">
            Don't have an account? <a href="/signup">Sign up</a>
        </div>
    </div>
</div>

<script src="/static/js/login.js"></script>

</body>
</html>
