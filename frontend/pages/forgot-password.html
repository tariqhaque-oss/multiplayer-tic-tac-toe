<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password - GameHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="auth-page">

<div>
    <div class="auth-logo">🎮 GameHub</div>

    <div class="panel">
        <h1>Forgot password</h1>
        <p class="subtitle">Enter your email and we'll send you a link to reset it</p>

        <form id="forgotPasswordForm" method="post" action="/api/auth/forgot-password">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autofocus>

            <button type="submit" class="btn-primary">Send Reset Link</button>
        </form>

        <div id="message" class="message"></div>

        <div class="footer-link">
            <a href="/login.html">Back to login</a>
        </div>
    </div>
</div>

<script src="/static/js/forgot-password.js"></script>

</body>
</html>
