<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up - GameHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="auth-page">

<div>
    <div class="auth-logo">🎮 GameHub</div>

    <div class="panel">
        <h1>Create your account</h1>
        <p class="subtitle">Join and start playing with friends</p>

        <form id="signupForm" method="post" action="/api/auth/signup">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autofocus>

            <label for="nickname">Display Name</label>
            <input type="text" id="nickname" name="nickname" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+"
                   title="3-24 characters: letters, numbers, underscore" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" minlength="8" maxlength="72" required>

            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" minlength="8" maxlength="72" required>

            <button type="submit" class="btn-primary">Create Account</button>
        </form>

        <div id="message" class="message"></div>

        <div class="footer-link">
            Already have an account? <a href="/login.html">Log in</a>
        </div>
    </div>
</div>

<script src="/static/js/signup.js"></script>

</body>
</html>
